name: CI

on:
  # Branches run through their pull request: one run per commit, not two.
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check version tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION_TAG: ${{ github.ref_name }}
        run: node --experimental-strip-types scripts/check-version-tag.ts "$VERSION_TAG"
      - name: Install without deprecated dependencies
        shell: bash
        run: |
          set +e
          npm ci 2> >(tee "$RUNNER_TEMP/npm-ci.stderr" >&2)
          npm_status=$?
          wait
          if [ "$npm_status" -ne 0 ]; then exit "$npm_status"; fi
          if grep -qi 'npm warn deprecated' "$RUNNER_TEMP/npm-ci.stderr"; then
            echo "Deprecated npm dependency detected" >&2
            exit 1
          fi
      - run: npm run verify
