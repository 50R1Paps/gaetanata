name: Portable launchers

on: [push, pull_request]

permissions:
  contents: read

jobs:
  launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Start and check portable launcher
        shell: pwsh
        env:
          GAETANATA_FORCE_RUNTIME: '1'
          GAETANATA_NO_BROWSER: '1'
        run: ./scripts/check-launchers.ps1
